<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Splash Screens Party Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #0f172a;
            color: white;
        }
        canvas {
            border: 2px solid #0ea5e9;
            margin: 10px;
            max-width: 100%;
        }
        button {
            background: #0ea5e9;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 14px;
        }
        button:hover {
            background: #0284c7;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .splash-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Générateur de Splash Screens Party Game</h1>
        <p>Cliquez sur les boutons pour télécharger les splash screens iOS.</p>
        
        <canvas id="canvas" width="1125" height="2436"></canvas>
        
        <h3>Splash Screens iPhone</h3>
        <div class="splash-grid">
            <button onclick="generateSplash(640, 1136, 'apple-splash-640-1136')">iPhone SE<br>640x1136</button>
            <button onclick="generateSplash(750, 1334, 'apple-splash-750-1334')">iPhone 8<br>750x1334</button>
            <button onclick="generateSplash(828, 1792, 'apple-splash-828-1792')">iPhone 11<br>828x1792</button>
            <button onclick="generateSplash(1125, 2436, 'apple-splash-1125-2436')">iPhone X/XS<br>1125x2436</button>
            <button onclick="generateSplash(1179, 2556, 'apple-splash-1179-2556')">iPhone 14 Pro<br>1179x2556</button>
            <button onclick="generateSplash(1242, 2208, 'apple-splash-1242-2208')">iPhone 8+<br>1242x2208</button>
            <button onclick="generateSplash(1242, 2688, 'apple-splash-1242-2688')">iPhone XS Max<br>1242x2688</button>
            <button onclick="generateSplash(1290, 2796, 'apple-splash-1290-2796')">iPhone 14 Pro Max<br>1290x2796</button>
        </div>

        <h3>Splash Screens iPad</h3>
        <div class="splash-grid">
            <button onclick="generateSplash(1536, 2048, 'apple-splash-1536-2048')">iPad<br>1536x2048</button>
            <button onclick="generateSplash(1668, 2388, 'apple-splash-1668-2388')">iPad Pro 11"<br>1668x2388</button>
            <button onclick="generateSplash(2048, 2732, 'apple-splash-2048-2732')">iPad Pro 12.9"<br>2048x2732</button>
        </div>

        <button onclick="generateAllSplashes()" style="background: #059669; font-size: 18px; padding: 15px 30px; margin-top: 20px;">
            📥 Télécharger TOUS les splash screens
        </button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function drawSplash(width, height) {
            canvas.width = width;
            canvas.height = height;
            
            // Background
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, width, height);
            
            // Calculate sizes based on screen dimensions
            const minDim = Math.min(width, height);
            const centerX = width / 2;
            const centerY = height / 2;
            
            // Gradient circle
            const radius = minDim * 0.15;
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
            gradient.addColorStop(0, '#0ea5e9');
            gradient.addColorStop(1, '#0284c7');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.fill();
            
            // Party emoji
            ctx.font = `${minDim * 0.12}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🎉', centerX, centerY);
            
            // App name
            ctx.fillStyle = 'white';
            ctx.font = `bold ${minDim * 0.04}px Arial`;
            ctx.fillText('Party Game', centerX, centerY + radius + minDim * 0.08);
        }

        function generateSplash(width, height, filename) {
            drawSplash(width, height);
            setTimeout(() => {
                const link = document.createElement('a');
                link.download = `${filename}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            }, 100);
        }

        async function generateAllSplashes() {
            const splashes = [
                [640, 1136, 'apple-splash-640-1136'],
                [750, 1334, 'apple-splash-750-1334'],
                [828, 1792, 'apple-splash-828-1792'],
                [1125, 2436, 'apple-splash-1125-2436'],
                [1179, 2556, 'apple-splash-1179-2556'],
                [1242, 2208, 'apple-splash-1242-2208'],
                [1242, 2688, 'apple-splash-1242-2688'],
                [1290, 2796, 'apple-splash-1290-2796'],
                [1536, 2048, 'apple-splash-1536-2048'],
                [1668, 2388, 'apple-splash-1668-2388'],
                [2048, 2732, 'apple-splash-2048-2732']
            ];

            for (const [width, height, filename] of splashes) {
                await new Promise(resolve => {
                    generateSplash(width, height, filename);
                    setTimeout(resolve, 500);
                });
            }
            
            alert('✅ Tous les splash screens ont été téléchargés !');
        }

        // Draw initial splash
        drawSplash(1125, 2436);
    </script>
</body>
</html>
